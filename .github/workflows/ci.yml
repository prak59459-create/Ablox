name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    name: AbloxCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0.3-noble
    steps:
      - uses: actions/checkout@v4

      # AbloxCore has no Apple-framework dependency, so the whole data model,
      # wire format, rule engine and character collision are testable here —
      # no simulator, no device, no Xcode.
      - name: Build
        run: swift build --target AbloxCore

      - name: Test
        run: swift test

  device-only:
    name: No patterns the iPad has rejected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two parts of this project compile nowhere but on device: the manifest,
      # which imports AppleProductTypes, and everything in Sources/ that needs
      # the iOS SDK. A mistake in either is a build failure on an iPad, not a
      # warning here — so this refuses spellings a device has already rejected.
      # See docs/ipad-build.md.
      - name: Check
        run: scripts/check-playgrounds-project.sh
