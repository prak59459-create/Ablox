name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    name: AbloxCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0.3-noble
    steps:
      - uses: actions/checkout@v4

      # AbloxCore has no Apple-framework dependency, so the whole data model,
      # wire format, rule engine and character collision are testable here —
      # no simulator, no device, no Xcode.
      - name: Build
        run: swift build --target AbloxCore

      - name: Test
        run: swift test

  manifest:
    name: App manifest has no known-bad patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ablox.swiftpm/Package.swift imports AppleProductTypes, which exists
      # only inside Swift Playgrounds and Xcode — it cannot be compiled here,
      # and a mistake in it stops the project opening on iPad rather than
      # producing a warning. This is a ratchet on spellings a device has
      # already rejected; see docs/swift-playgrounds-manifest.md.
      - name: Check
        run: scripts/check-app-manifest.sh
