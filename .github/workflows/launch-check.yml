name: Launch check

# Starts the app on an iPad simulator and fails when it does not stay
# running, printing why (scripts/ios-launch-check.sh). Swift Playgrounds on
# the iPad only says that the app may have crashed.
on:
  push:
    branches: ["**"]
    paths:
      - "Ablox.swiftpm/**"
      - "scripts/ios-launch-check.sh"
      - ".github/workflows/launch-check.yml"
  workflow_dispatch:
    inputs:
      watch:
        description: "Seconds to watch the app after it starts"
        type: string
        default: "30"

jobs:
  launch:
    name: Start on an iPad simulator
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build, start and watch
        run: scripts/ios-launch-check.sh
        env:
          WATCH: ${{ inputs.watch || '30' }}
          OUT: ${{ runner.temp }}/launch
      - name: Keep the logs and the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-check
          path: ${{ runner.temp }}/launch
          if-no-files-found: ignore

  iphone:
    name: Start on an iPhone simulator, upright and on its side
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build, start and open every tab both ways
        run: scripts/ios-launch-check.sh
        env:
          DEVICE: iPhone
          TABS: Play Games Worlds Avatar Shop Settings
          ORIENTATIONS: portrait landscape
          BENCHMARK: "0"
          WATCH: "20"
          OUT: ${{ runner.temp }}/launch
      - name: Keep the logs and the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-check-iphone
          path: ${{ runner.temp }}/launch
          if-no-files-found: ignore
