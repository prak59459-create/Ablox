name: iOS build times

# The app built with the real iOS SDK, and where the compiler's time goes.
# Swift Playgrounds on an older iPad takes minutes over the same work, so
# the slowest functions listed here are the ones to make simpler.
on:
  push:
    branches: ["**"]
    paths:
      - "Ablox.swiftpm/**"
      - "scripts/ios-build-times.sh"
      - "scripts/ios-build-compare.sh"
      - "scripts/ios-build-incremental.sh"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      per_file:
        description: "One file per compile job, to list what each file costs"
        type: boolean
        default: false
      compare:
        description: "Build settings to compare against a plain build, e.g. GCC_GENERATE_DEBUGGING_SYMBOLS=NO"
        type: string
        default: ""
      patch:
        description: "A change to try without pushing it: a unified diff from the repository root, gzipped, base64"
        type: string
        default: ""
      patch_compare:
        description: "Compare builds with and without the patch (otherwise the patch is applied and reported)"
        type: boolean
        default: false
      repeats:
        description: "Pairs of builds to compare"
        type: string
        default: "2"
      incremental:
        description: "Time rebuilds after small changes, as after an update written into the project"
        type: boolean
        default: false

jobs:
  ios:
    name: Build for iPad and time it
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and report
        if: ${{ !inputs.compare && !inputs.patch_compare && !inputs.incremental }}
        run: scripts/ios-build-times.sh
        env:
          PER_FILE: ${{ inputs.per_file && '1' || '' }}
          PATCH: ${{ inputs.patch }}
      - name: Rebuilds after small changes
        if: ${{ inputs.incremental }}
        run: scripts/ios-build-incremental.sh
        env:
          PATCH: ${{ inputs.patch }}
      - name: Compare a build setting or a change
        if: ${{ inputs.compare || inputs.patch_compare }}
        run: scripts/ios-build-compare.sh
        env:
          COMPARE: ${{ inputs.compare }}
          PATCH: ${{ inputs.patch }}
          REPEATS: ${{ inputs.repeats }}
